
name: Gulf Situation Room Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show Qatar time
        run: TZ=Asia/Qatar date '+Qatar time: %Y-%m-%d %H:%M:%S'

      - name: Run Gulf Monitor
        run: python monitor.py
