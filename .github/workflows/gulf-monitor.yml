
name: Gulf Situation Room Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Show Qatar time
        run: |
          echo "Gulf Situation Room"
          TZ=Asia/Qatar date '+Qatar time: %Y-%m-%d %H:%M:%S'

      - name: Check workflow
        run: |
          echo "Workflow is working."
          echo "News collection and AI analysis are not configured yet."
